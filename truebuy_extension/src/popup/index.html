<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TrueBuy</title>
  <style>
    body { width: 240px; padding: 20px; font-family: "Amazon Ember", Arial, sans-serif; background: #fff; text-align: center; }
    .header { font-weight: 900; font-size: 18px; color: #00B894; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .slogan { font-size: 12px; color: #555; margin-bottom: 20px; line-height: 1.4; }
    .status-card { background: #E6F7F4; border: 1px solid #B2EBDC; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
    .status-text { font-size: 13px; font-weight: 700; color: #00886D; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .footer { font-size: 10px; color: #999; border-top: 1px solid #eee; padding-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <span>🛡️</span> TrueBuy
  </div>
  <div class="slogan">
    AI-Powered Amazon<br>Review Analysis
  </div>
  
  <div class="status-card">
    <div class="status-text">
      <span>✅</span> Active
    </div>
  </div>

  <div class="footer">
    Version <span id="version">Loading...</span>
  </div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
